name: DomainsRenew

on:
  # schedule:
    # 每10天运行：1号、11号、21号 中午12:12 (北京时间)
    # UTC 时间 = 北京时间 - 8小时 = 04:12
    # - cron: '1 1 1 * *'
  workflow_dispatch:
  repository_dispatch:   
    types: [ct8,home,kata]   #触发事件名称

jobs:
  keepalive:
    name: Run Jobs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    concurrency:
      group: browser-login
      cancel-in-progress: false

    steps:
      - name: Check Domains Expiredate
        id: fetch_step
        run: |
          RESPONSE_FILE="${{ runner.temp }}/accounts.json"
          curl -f -s -L --max-time 10 -o "$RESPONSE_FILE" https://dg.str.xx.kg?accounts
          CURL_EXIT_CODE=$?
          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "::error::请求失败，退出码: $CURL_EXIT_CODE"
            exit $CURL_EXIT_CODE
          fi
          RESPONSE_CONTENT=$(cat "$RESPONSE_FILE")
          if [ "$RESPONSE_CONTENT" == "0" ]; then
            echo "::warning::未获取到有效账号，退出作业。"
            exit 0
          fi

          # 情况 D: 其他情况，标记成功，继续执行
          echo "::warning::获取到有效账号，执行WEB登录步骤。"
          echo $RESPONSE_CONTENT |jq
          echo "fetch_status=success" >> $GITHUB_OUTPUT
          
      - name: checkout Repository
        if: steps.fetch_step.outputs.fetch_status == 'success'
        uses: actions/checkout@v4

      - name: Setting Python
        if: steps.fetch_step.outputs.fetch_status == 'success'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Selenium
        if: steps.fetch_step.outputs.fetch_status == 'success'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install seleniumbase>=4.25.0 pyvirtualdisplay>=3.0 requests>=2.31.0

      - name: Configure proxy
        if: steps.fetch_step.outputs.fetch_status == 'success'
        env:
          HY2_URL: ${{ vars.HY2_URL }}
        run: |
          # exit 0
          if [ -z "$HY2_URL" ]; then
            echo "HY2_URL 未设置，跳过代理配置，使用直连模式"
            echo "PROXY_SERVER=" >> $GITHUB_ENV
            exit 0
          fi
          chmod +x hysteria

          URL="${HY2_URL#hysteria2://}"
          PASSWORD="${URL%%@*}"
          SERVER="${URL#*@}"; SERVER="${SERVER%%\?*}"
          SNI=$(echo "$URL" | grep -oP 'sni=\K[^&]+' || echo "${SERVER%%:*}")

          cat > hy2.yaml << EOF
          server: ${SERVER}
          auth: ${PASSWORD}
          tls:
            sni: ${SNI}
            insecure: true
          http:
            listen: 127.0.0.1:7890
          EOF

          ./hysteria client --disable-update-check -c hy2.yaml &
          sleep 3
          echo "PROXY_SERVER=http://127.0.0.1:7890" >> $GITHUB_ENV


      - name: Perform Task
        if: steps.fetch_step.outputs.fetch_status == 'success'
        env:
          PASSWORD: ${{ secrets.PASSWORD }}
          TG_API: ${{ vars.TG_API }}
        run: |
          cp ${{ runner.temp }}/accounts.json ./accounts.json
          python domains.py
       

      - name: Upload Test Images
        if: steps.fetch_step.outputs.fetch_status == 'success'
        uses: actions/upload-artifact@v4
        with:
           name: screenshots-${{ github.run_number }}
           path: output/screenshots/
           retention-days: 3

      - name: Clean Jobs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
