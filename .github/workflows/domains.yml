name: DomainsRenew

on:
  schedule:
    # 每10天运行：1号、11号、21号 中午12:12 (北京时间)
    # UTC 时间 = 北京时间 - 8小时 = 04:12
    - cron: '1 1 1 * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Run Jobs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    concurrency:
      group: browser-login
      cancel-in-progress: false

    steps:
      - name: Check Domains Expiredate
        id: fetch_step
        run: |
          RESPONSE_FILE="${{ runner.temp }}/accounts.json"
          curl -f -s -L --max-time 10 -o "$RESPONSE_FILE" https://dg.str.xx.kg?accounts
          CURL_EXIT_CODE=$?
          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "::error::请求失败，退出码: $CURL_EXIT_CODE"
            exit $CURL_EXIT_CODE
          fi

          if [ "$RESPONSE_CONTENT" == "0" ]; then
            echo "::warning::未获取到有效账号，退出作业。"
            exit 0
          fi

          # 情况 D: 其他情况，标记成功，继续执行
          echo "获取到有效账号，执行WEB登录步骤。"
          echo "fetch_status=success" >> $GITHUB_OUTPUT
          
      - name: checkout Repository
        if: steps.fetch_step.outputs.fetch_status == 'success'
        uses: actions/checkout@v4

      - name: Setting Python
        if: steps.fetch_step.outputs.fetch_status == 'success'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Perform Task
        if: steps.fetch_step.outputs.fetch_status == 'success'
        env:
          PASSWORD: ${{ secrets.PASSWORD }}
          TG_API: ${{ vars.TG_API }}
        run: |
          cp ${{ runner.temp }}/accounts.json ./accounts.json
          python test.py
       



      - name: Clean Jobs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
